name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Claude Code
        uses: pleaseai/setup-claude-code@v1.1.4
      
      - name: Run build
        run: npm run build